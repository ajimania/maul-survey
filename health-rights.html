<style>
:root{
  --paper:#F4F1E9;
  --card:#FFFDF7;
  --ink:#26302B;
  --ink-soft:#5C6A62;
  --muted:#8D968F;
  --green:#2E6A55;
  --green-deep:#1F4C3C;
  --green-pale:#E4EEE9;
  --coral:#D2603F;
  --coral-deep:#B24A2C;
  --coral-pale:#FAE7DF;
  --gold:#C99A3A;
  --line:#E2DCCC;
  --shadow:rgba(38,48,43,.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(circle at 28% 38%, rgba(38,48,43,.045) 1.4px, transparent 2px),
    radial-gradient(circle at 72% 78%, rgba(38,48,43,.03) 1px, transparent 1.6px);
  background-size:56px 56px, 36px 36px;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;word-break:keep-all;line-height:1.6;
}
b,strong{font-weight:700;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

.wrap{max-width:620px;margin:0 auto;padding:0 20px 120px;}

/* 진행바 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,241,233,.94);backdrop-filter:blur(8px);
  padding:14px 20px 12px;border-bottom:1px solid var(--line);}
.topbar.hide{display:none;}
.topbar-in{max-width:620px;margin:0 auto;}
.pbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1);}
.plabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:500;}

/* 화면 */
.screen{display:none;animation:pop .4s ease both;}
.screen.on{display:block;}
@keyframes pop{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* 인트로 */
.intro{padding:56px 0 0;}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.09em;color:var(--coral-deep);margin-bottom:16px;}
h1{font-size:31px;font-weight:900;line-height:1.35;letter-spacing:-.02em;margin-bottom:20px;}
h1 em{font-style:normal;color:var(--green);}
.quote{background:var(--card);border-left:4px solid var(--green);border-radius:0 12px 12px 0;
  padding:20px 22px;box-shadow:0 2px 10px var(--shadow);margin-bottom:26px;}
.quote p{font-size:15.5px;font-weight:700;line-height:1.65;}
.quote cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:500;}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
.chip{font-size:12px;font-weight:700;background:var(--green-pale);color:var(--green-deep);
  padding:6px 13px;border-radius:99px;}
.chip.warm{background:var(--coral-pale);color:var(--coral-deep);}

.btn{display:block;width:100%;background:var(--green);color:#fff;font-size:16px;font-weight:900;
  padding:17px;border-radius:14px;box-shadow:0 4px 14px rgba(46,106,85,.28);transition:transform .15s,box-shadow .15s,opacity .15s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(46,106,85,.34);}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none;}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;font-size:14px;font-weight:700;padding:13px;}
.btn.ghost:hover{transform:none;color:var(--ink);}

/* 문항 */
.sec-head{padding:30px 0 4px;}
.sec-num{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;}
.sec-title{font-size:25px;font-weight:900;letter-spacing:-.015em;}
.sec-title span{font-size:14px;font-weight:700;color:var(--ink-soft);margin-left:9px;letter-spacing:0;}

.q{background:var(--card);border-radius:16px;padding:20px 20px 16px;margin-top:16px;
  box-shadow:0 2px 10px var(--shadow);border:1px solid var(--line);}
.q-num{font-size:11.5px;font-weight:900;color:var(--coral-deep);letter-spacing:.06em;margin-bottom:7px;}
.q-text{font-size:16px;font-weight:700;line-height:1.55;margin-bottom:15px;}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--line);

.opt.sel .dot{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 3px var(--green-pale);}

.rv-tag{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.06em;
  background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:99px;margin-bottom:18px;}
.rv-hook{font-size:24px;font-weight:900;line-height:1.45;letter-spacing:-.02em;margin-bottom:18px;}
.rv-hook em{font-style:normal;color:var(--coral-deep);}

.rv-src{font-size:11.5px;font-weight:900;color:var(--green);letter-spacing:.04em;margin-bottom:10px;}
.rv-quote{font-size:15px;font-weight:700;line-height:1.7;color:var(--ink);}
.rv-note{font-size:14.5px;color:var(--ink-soft);line-height:1.75;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.rv-note strong{color:var(--ink);}

.result{padding:44px 0 0;}
.res-score{text-align:center;margin-bottom:8px;}

.res-score .n small{font-size:22px;font-weight:700;color:var(--muted);letter-spacing:0;}
.res-score .cap{font-size:13px;color:var(--muted);font-weight:700;margin-top:8px;}

.radar{display:block;margin:6px auto 4px;max-width:100%;}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 2px 10px var(--shadow);

.card h3{font-size:16px;font-weight:900;margin-bottom:6px;}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:16px;}

.axis-row{margin-bottom:16px;}
.axis-row:last-child{margin-bottom:0;}
.axis-lab{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:900;margin-bottom:7px;}
.axis-lab small{font-size:12px;font-weight:500;color:var(--muted);}
.axis-lab b{font-size:17px;}
.track{height:13px;background:var(--line);border-radius:99px;overflow:hidden;}
.track i{display:block;height:100%;border-radius:99px;transition:width .9s cubic-bezier(.4,0,.2,1);}
.track i.p{background:var(--coral);}
.track i.c{background:var(--green);}

.type-card .td{font-size:14.5px;line-height:1.75;opacity:.93;}

.low-card{border-left:4px solid var(--coral);}
.low-card .ln{font-size:20px;font-weight:900;color:var(--coral-deep);margin-bottom:10px;}

.map{margin-top:16px;}
.map-item{padding:14px 0;border-bottom:1px dashed var(--line);}
.map-item:last-child{border-bottom:none;}
.map-bullet{width:9px;height:9px;border-radius:50%;flex:none;margin-top:8px;}
.map-body{flex:1;min-width:0;}

.map-src{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.55;}
.map-score{font-size:13px;font-weight:900;color:var(--muted);flex:none;align-self:center;}


.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:28px;text-align:center;}
/* 결과 · 근거 아코디언 */
.map-row{display:flex;gap:13px;}
.src-toggle{font-size:12.5px;font-weight:700;color:var(--green);padding:7px 0 0 22px;}
.src-toggle:hover{text-decoration:underline;}
.src-detail{display:none;margin:10px 0 2px 22px;padding:14px 16px;background:var(--green-pale);
  border-radius:11px;}
.src-detail.open{display:block;}


@media (max-width:400px){
  h1{font-size:27px;}
  .rv-hook{font-size:21px;}
  .type-card .tn{font-size:23px;}
}
</style>

/* ══════════ 상태 ══════════ */
const ans = {};
const flow = [{t:'intro'}];
AREAS.forEach((a,i)=> flow.push({t:'q',i:i}));
flow.push({t:'res'});
let step = 0;
let saved = false;

/* 워크숍 회차 구분용 (예: ?w=20260910) · 없으면 null */
const COHORT = new URLSearchParams(location.search).get('w') || null;

const stage  = document.getElementById('stage');
const topbar = document.getElementById('topbar');
const pfill  = document.getElementById('pfill');
const plabL  = document.getElementById('plab-l');
const plabR  = document.getElementById('plab-r');

function areaScore(i){
  return AREAS[i].questions.reduce((s,_,qi)=> s + (ans[i+'-'+qi] ?? 0), 0);
}
function areaDone(i){
  return AREAS[i].questions.every((_,qi)=> ans[i+'-'+qi] !== undefined);
}
function answered(){ return Object.keys(ans).length; }
function nextLabel(i){ return i < AREAS.length-1 ? '다음' : '결과 보기'; }

function syncBar(){
  const f = flow[step];
  if(f.t==='intro'){ topbar.classList.add('hide'); return; }
  topbar.classList.remove('hide');
  pfill.style.width = (answered()/30*100)+'%';
  if(f.t==='res'){ plabL.textContent='완료'; plabR.textContent='30 / 30'; }
  else{
    plabL.textContent = AREAS[f.i].name + ' · ' + AREAS[f.i].sub;
    plabR.textContent = answered() + ' / 30';
  }
}

function render(){
  const f = flow[step];
  if(f.t==='intro')       stage.innerHTML = viewIntro();
  else if(f.t==='q')      stage.innerHTML = viewQ(f.i);
  else                    stage.innerHTML = viewRes();
  syncBar();
  window.scrollTo(0,0);
  if(f.t==='res'){ drawRadar(); save(); }
}

/* ══════════ 레이더 차트 ══════════ */
function drawRadar(){
  const svg = document.getElementById('radar');
  if(!svg) return;
  const cx=170, cy=148, R=92;
  const scores = AREAS.map((_,i)=>areaScore(i));
  const pt=(i,r)=>{
    const ang = -Math.PI/2 + i*Math.PI/3;
    return [cx + Math.cos(ang)*R*r, cy + Math.sin(ang)*R*r];
  };
  let h='';
  [0.25,0.5,0.75,1].forEach(r=>{
    const p = [0,1,2,3,4,5].map(i=>pt(i,r).join(',')).join(' ');
    h += `<polygon points="${p}" fill="none" stroke="#E2DCCC" stroke-width="1"/>`;
  });
  for(let i=0;i<6;i++){
    const [x,y]=pt(i,1);
    h += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E2DCCC" stroke-width="1"/>`;
  }
  const poly = scores.map((s,i)=>pt(i, Math.max(s/15,0.04)).join(',')).join(' ');
  h += `<polygon points="${poly}" fill="rgba(46,106,85,.22)" stroke="#2E6A55" stroke-width="2.5" stroke-linejoin="round"/>`;
  scores.forEach((s,i)=>{
    const [x,y]=pt(i, Math.max(s/15,0.04));
    h += `<circle cx="${x}" cy="${y}" r="4" fill="#2E6A55"/>`;
  });
  for(let i=0;i<6;i++){
    const [x,y]=pt(i,1.30);
    const col = AREAS[i].axis==='p' ? '#B24A2C' : '#1F4C3C';
    h += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
      font-size="13" font-weight="900" fill="${col}" font-family="Noto Sans KR">${AREAS[i].name}</text>`;
    h += `<text x="${x}" y="${y+15}" text-anchor="middle" dominant-baseline="middle"
      font-size="11" font-weight="700" fill="#8D968F" font-family="Noto Sans KR">${scores[i]}/15</text>`;
  }
  svg.innerHTML = h;
}

/* ══════════ 저장 ══════════ */
async function save(){
  if(saved) return;
  saved = true;
  const ind = document.getElementById('saveind');
  const scores = AREAS.map((_,i)=>areaScore(i));
  const total  = scores.reduce((a,b)=>a+b,0);
  const pRaw = scores[0]+scores[1], cRaw = total - pRaw;
  const p = Math.round(pRaw/30*100);
  const c = Math.round(cRaw/60*100);
  let lowIdx = 0;
  scores.forEach((s,i)=>{ if(s < scores[lowIdx]) lowIdx = i; });

  const payload = {
    cohort: COHORT,
    s_body:scores[0], s_mind:scores[1], s_place:scores[2],
    s_care:scores[3], s_social:scores[4], s_context:scores[5],
    personal_pct: p,
    condition_pct: c,
    total_pct: Math.round(total/90*100),
    type_key: (p>=60?'h':'l') + (c>=60?'h':'l'),
    lowest_area: AREAS[lowIdx].key
  };
  AREAS.forEach((a,i)=> a.questions.forEach((_,qi)=>{
    payload['q'+(i*5+qi+1)] = ans[i+'-'+qi];
  }));

  try{
    const { error } = await sb.from('health_rights').insert(payload);
    if(error){ console.warn(error); if(ind) ind.textContent = '저장에 실패했습니다 (결과는 그대로 보실 수 있습니다)'; }
    else if(ind) ind.textContent = '응답이 익명으로 저장되었습니다';
  }catch(e){
    console.warn(e);
    if(ind) ind.textContent = '저장에 실패했습니다 (결과는 그대로 보실 수 있습니다)';
  }
}

/* ══════════ 결과 이미지 저장 ══════════ */
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);     g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

async function downloadCard(){
  const btn = document.getElementById('dlbtn');
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '이미지를 만드는 중…'; }
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;

    const W=1080, H=1420;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const g=cv.getContext('2d');
    const F=(w,px)=>`${w} ${px}px 'Noto Sans KR', -apple-system, sans-serif`;
    const C={paper:'#F4F1E9',ink:'#26302B',muted:'#8D968F',line:'#E2DCCC',
             green:'#2E6A55',greenDeep:'#1F4C3C',coral:'#D2603F',coralDeep:'#B24A2C'};

    const scores=AREAS.map((_,i)=>areaScore(i));
    const total=scores.reduce((a,b)=>a+b,0);
    const pct=Math.round(total/90*100);
    const pRaw=scores[0]+scores[1], cRaw=total-pRaw;
    const pp=Math.round(pRaw/30*100), cc=Math.round(cRaw/60*100);
    const type=TYPES[(pp>=60?'h':'l')+(cc>=60?'h':'l')];

    g.fillStyle=C.paper; g.fillRect(0,0,W,H);
    g.textAlign='center';

    g.fillStyle=C.coralDeep; g.font=F(900,26);
    g.fillText('청년 건강권 자가진단', W/2, 96);
    g.fillStyle=C.ink; g.font=F(900,46);
    g.fillText('나는 충분히 건강한 삶을 살고 있는가', W/2, 158);

    /* 총점 */
    g.font=F(900,132); const w1=g.measureText(String(pct)).width;
    g.font=F(700,44);  const w2=g.measureText('점').width;
    const sx=(W-(w1+w2+12))/2;
    g.textAlign='left';
    g.font=F(900,132); g.fillStyle=C.green; g.fillText(String(pct), sx, 302);
    g.font=F(700,44);  g.fillStyle=C.muted;  g.fillText('점', sx+w1+12, 302);
    g.textAlign='center';
    g.fillStyle=C.muted; g.font=F(700,24);
    g.fillText('6개 영역 종합 · 100점 환산', W/2, 348);

    /* 레이더 */
    const cx=540, cy=662, R=195;
    const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3; return [cx+Math.cos(a)*R*r, cy+Math.sin(a)*R*r];};
    g.strokeStyle=C.line; g.lineWidth=2;
    [0.25,0.5,0.75,1].forEach(r=>{
      g.beginPath();
      for(let i=0;i<6;i++){const[x,y]=pt(i,r); i?g.lineTo(x,y):g.moveTo(x,y);}
      g.closePath(); g.stroke();
    });
    for(let i=0;i<6;i++){const[x,y]=pt(i,1); g.beginPath(); g.moveTo(cx,cy); g.lineTo(x,y); g.stroke();}
    g.beginPath();
    scores.forEach((v,i)=>{const[x,y]=pt(i,Math.max(v/15,0.04)); i?g.lineTo(x,y):g.moveTo(x,y);});
    g.closePath();
    g.fillStyle='rgba(46,106,85,.22)'; g.fill();
    g.strokeStyle=C.green; g.lineWidth=5; g.lineJoin='round'; g.stroke();
    scores.forEach((v,i)=>{const[x,y]=pt(i,Math.max(v/15,0.04));
      g.beginPath(); g.arc(x,y,8,0,Math.PI*2); g.fillStyle=C.green; g.fill();});
    for(let i=0;i<6;i++){
      const[x,y]=pt(i,1.27);
      g.fillStyle=AREAS[i].axis==='p'?C.coralDeep:C.greenDeep; g.font=F(900,28);
      g.fillText(AREAS[i].name, x, y+8);
      g.fillStyle=C.muted; g.font=F(700,23);
      g.fillText(scores[i]+' / 15', x, y+42);
    }

    /* 두 축 막대 */
    const bx=110, bw=W-220;
    const bar=(y,lab,val,col)=>{
      g.textAlign='left';  g.font=F(900,30); g.fillStyle=C.ink;  g.fillText(lab, bx, y);
      g.textAlign='right'; g.font=F(900,34); g.fillStyle=col;    g.fillText(val+'%', bx+bw, y);
      g.textAlign='left';
      g.fillStyle=C.line; rr(g,bx,y+18,bw,22,11); g.fill();
      g.fillStyle=col;    rr(g,bx,y+18,Math.max(bw*val/100,22),22,11); g.fill();
    };
    bar(1012,'내 몸과 마음', pp, C.coral);
    bar(1100,'나를 둘러싼 조건', cc, C.green);

    /* 유형 */
    g.fillStyle=C.greenDeep; rr(g,110,1168,W-220,124,22); g.fill();
    g.textAlign='center';
    g.fillStyle='rgba(255,255,255,.68)'; g.font=F(900,20);
    g.fillText('당신의 유형', W/2, 1212);
    g.fillStyle='#ffffff'; g.font=F(900,42);
    g.fillText(type.n, W/2, 1266);

    /* 출처 */
    g.fillStyle=C.muted; g.font=F(500,20);
    g.fillText('문항 출처 · 한국보건사회연구원 「청년 건강 실태와 정책과제」(2025)', W/2, 1344);
    g.fillText('WHO 건강불평등 발생 기전 모형(2008) · 의학적 진단이 아닙니다', W/2, 1376);

    const blob = await new Promise(res=>cv.toBlob(res,'image/png'));
    const name = '건강권-자가진단-결과.png';

    /* 모바일에서는 공유 시트가 저장에 더 편합니다 */
    if(navigator.canShare){
      try{
        const file = new File([blob], name, {type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file]});
          return;
        }
      }catch(e){ /* 취소하거나 미지원이면 아래 내려받기로 */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){
    console.warn(e);
    alert('이미지를 만들지 못했습니다. 화면을 캡처해 주세요.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = label || '결과 이미지 저장하기'; }
  }
}

/* ══════════ 동작 ══════════ */
function pick(i,qi,oi){
  ans[i+'-'+qi] = oi;
  const qEl = stage.querySelectorAll('.q')[qi];
  if(qEl) qEl.querySelectorAll('.opt').forEach((el,idx)=> el.classList.toggle('sel', idx===oi));
  const btn = document.getElementById('nextbtn');
  if(btn){
    const done = areaDone(i);
    btn.disabled = !done;
    btn.textContent = done ? nextLabel(i) : '5문항에 모두 답해주세요';
  }
  syncBar();
}
function toggleSrc(i){
  const el = document.getElementById('src-'+i);
  if(!el) return;
  const open = el.classList.toggle('open');
  el.previousElementSibling.textContent = open ? '접기' : '보고서 근거 보기';
}
function next(){ if(step < flow.length-1){ step++; render(); } }
function prev(){ if(step > 0){ step--; render(); } }
function restart(){
  Object.keys(ans).forEach(k=>delete ans[k]);
  step = 0; saved = false; render();
}

Object.assign(window, {next, prev, pick, restart, toggleSrc, downloadCard});
render();
</script>
</body>
</html>

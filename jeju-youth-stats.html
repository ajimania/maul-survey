<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 청년 정책 길찾기 집계</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF3E1; --card:#FFFDF4; --ink:#2B3B2F; --green:#1E6E48; --green-deep:#174F35; --green-pale:#E4EFE7;
  --coral:#E76F5A; --mustard:#C9A227; --orange:#EE8A3F; --muted:#7d8a7f; --line:#E6DEC6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1100px;margin:0 auto;padding:34px 22px 100px;}
h1{font-size:24px;font-weight:900;margin-bottom:4px;}
.sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.7;}
h2{font-size:17px;font-weight:900;color:var(--green-deep);margin:36px 0 10px;padding-top:22px;border-top:2px solid var(--line);}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:10px;overflow-x:auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:800px){.grid2{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-weight:700;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td:first-child{min-width:210px;}
.kpis{display:flex;flex-wrap:wrap;gap:10px;}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 18px;min-width:150px;}
.kpi b{display:block;font-size:26px;font-weight:900;color:var(--green-deep);}
.kpi span{font-size:12.5px;color:var(--muted);}
.bar-row{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;}
.bar-row .bl{width:230px;flex:none;text-align:right;color:#4C574E;line-height:1.35;}
.bar-track{flex:1;height:16px;background:#EDE6D2;border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:var(--green);border-radius:99px;min-width:2px;}
.bar-fill.c{background:var(--coral);} .bar-fill.m{background:var(--mustard);} .bar-fill.o{background:var(--orange);}
.bar-row .bn{width:70px;flex:none;font-weight:900;font-size:12.5px;}
.free{border-left:3px solid var(--green-pale);padding:6px 12px;margin-top:9px;font-size:13.5px;line-height:1.65;}
.free .who{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px;}
.btn{border:none;border-radius:11px;padding:10px 18px;font-size:14px;font-weight:900;cursor:pointer;background:var(--green);color:#fff;font-family:inherit;}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#gate input{border:2px solid var(--line);border-radius:12px;padding:13px 16px;font-size:16px;text-align:center;font-family:inherit;}
#gate .err{color:#C7583F;font-size:13px;font-weight:700;min-height:18px;}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--green-pale);color:var(--green-deep);margin-right:4px;}
.demo-banner{background:var(--mustard);color:#fff;font-weight:900;text-align:center;padding:8px;font-size:13px;}
</style>
</head>
<body>

<div id="gate">
  <div style="font-size:20px;font-weight:900;">제주 청년 정책 길찾기 · 응답 집계</div>
  <input type="password" id="pw" placeholder="관리자 비밀번호">
  <div class="err" id="err"></div>
  <button class="btn" id="goBtn">열기</button>
</div>

<div id="app" style="display:none;">
  <div class="demo-banner" id="demo-banner" style="display:none">데모 데이터입니다 — 실제 응답이 아닙니다</div>
  <div class="wrap">
    <h1>제주 청년 정책 길찾기 — 응답 집계</h1>
    <div class="sub" id="meta"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" id="csv-main">응답 CSV</button>
      <button class="btn ghost" id="csv-aware">사업 인지 CSV</button>
      <button class="btn ghost" id="csv-text">서술 응답 CSV</button>
    </div>
    <div id="out"></div>
  </div>
</div>

<script>
const SB_URL = 'https://hncuvjrghniwihhfpata.supabase.co';
const SB_KEY = 'sb_publishable_JcCV2PIrJV59VK9ihPCmXg_J0RmJ9AB';
const DEMO = new URLSearchParams(location.search).get('demo') === '1';

const CELLS = [
  ['생계_생존','생계','먹고사는 문제가 풀리는 것'], ['생계_자아실현','생계','하고 싶은 일을 하며 크는 것'],
  ['관계_청년커뮤니티','관계','기댈 또래가 있는 것'], ['관계_지역참여','관계','동네 일에 끼어 목소리를 낼 통로가 있는 것'],
  ['정서_자아건강','정서','마음이 버티는 힘'], ['정서_지역애착','정서','이 동네에 마음이 붙고 정드는 것'],
  ['공간_주거','공간','살 곳과 병원·안전'], ['공간_일터','공간','일하고 활동할 자리'],
  ['문화_누리기','문화','놀고 누리는 삶'], ['문화_생산하기','문화','만들고 발표하는 활동'],
];
const CT = Object.fromEntries(CELLS.map(c => [c[0], c[2]]));
const REL = {native:'제주에서 나고 자람', uturn:'떠났다가 돌아옴', migrant:'다른 지역에서 옴', considering:'올지 고민 중'};
const YEARS = {lt1:'1년 미만', '1-3':'1~3년', '3-5':'3~5년', '5-10':'5~10년', '10+':'10년 이상'};
const REGION = {'jejusi-dong':'제주시 동', 'jejusi-eup':'제주시 읍·면', 'sgp-dong':'서귀포시 동', 'sgp-eup':'서귀포시 읍·면', outside:'제주 밖'};
const EXP = {got:'받아본 적 있음', rejected:'신청했는데 안 됨', never:'신청해본 적 없음'};
const DIMS = ['생계', '관계', '정서', '공간', '문화'];
const OPTS = {
  g1:['생계_생존','당장 생활비가 빠듯해요'], g2:['생계_생존','일자리를 찾고 있는데 잘 안 돼요'],
  g3:['생계_자아실현','하고 싶은 일을 배우고 키우고 싶어요'], g4:['생계_자아실현','창업하거나 내 일을 시작하고 싶어요'], g5:['생계_자아실현','일은 있지만 더 크고 싶어요'],
  r1:['관계_청년커뮤니티','고민을 나눌 또래가 가까이 없어요'], r2:['관계_청년커뮤니티','취미나 관심사로 어울릴 모임을 찾고 싶어요'],
  r3:['관계_지역참여','동네나 지역 일에 내 의견을 낼 곳이 없어요'], r4:['관계_지역참여','이 지역에서 주민으로 인정받는 느낌이 들지 않아요'],
  e1:['정서_자아건강','지치고 번아웃이 온 것 같아요'], e2:['정서_자아건강','마음이 힘들 때 이야기할 곳이 필요해요'], e3:['정서_자아건강','앞으로 뭘 해야 할지 막막해요'],
  e4:['정서_지역애착','제주에 정이 잘 붙지 않아요'], e5:['정서_지역애착','제주에 온 지 얼마 안 돼 아직 낯설어요'],
  p1:['공간_주거','집 구하기나 월세가 부담돼요'], p2:['공간_주거','병원이나 생활 편의시설이 아쉬워요'],
  p3:['공간_일터','일하거나 작업할 공간이 필요해요'], p4:['공간_일터','모임이나 활동을 할 장소가 마땅치 않아요'],
  c1:['문화_누리기','제주에서 즐길 문화·여가가 부족해요'], c2:['문화_누리기','문화생활에 쓸 돈이 부담돼요'],
  c3:['문화_생산하기','내가 만든 것을 발표하거나 펼칠 기회가 없어요'], c4:['문화_생산하기','창작 활동을 이어갈 지원이 필요해요'],
};
const picked = p => Object.values(p.ans || {}).flat();
const AW = {new:'처음 봐요', knew:'알고 있었어요', used:'받아봤어요'};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
let ROWS = [], BASE = {};

async function jejuBase(){
  try {
    const t = await (await fetch('jeju-youth.html', {cache: 'no-store'})).text();
    const m = t.match(/\/\*DATA_START\*\/([\s\S]*?)\/\*DATA_END\*\//);
    const data = JSON.parse(m[1].replace(/<\\\//g, '</'));
    for (const [k] of CELLS) BASE[k] = data.filter(p => p.main === k && !p.stages.includes('결혼,출산기')).length;
  } catch (e) { BASE = {}; }
}

async function load(pass){
  const r = await fetch(SB_URL + '/rest/v1/rpc/jy_admin', {
    method: 'POST', headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify({p_pass: pass}),
  });
  if (!r.ok) throw new Error(await r.text());
  return await r.json();
}

document.getElementById('goBtn').onclick = open;
document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') open(); };
async function open(){
  const err = document.getElementById('err'); err.textContent = '';
  try {
    ROWS = DEMO ? demoRows() : await load(document.getElementById('pw').value);
    await jejuBase();
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (DEMO) document.getElementById('demo-banner').style.display = 'block';
    render();
  } catch (e) { err.textContent = String(e.message || e).includes('denied') ? '비밀번호가 맞지 않아요.' : '불러오지 못했어요: ' + (e.message || e); }
}
if (DEMO) open();

function count(list){ const m = {}; list.forEach(v => { if (v != null && v !== '') m[v] = (m[v] || 0) + 1; }); return m; }
function bars(m, label = k => k, cls = '', total){
  const ent = Object.entries(m).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...ent.map(e => e[1]));
  const T = total ?? ent.reduce((s, e) => s + e[1], 0);
  return ent.map(([k, v]) => `<div class="bar-row"><div class="bl">${esc(label(k))}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${v / max * 100}%"></div></div><div class="bn">${v} · ${pct(v, T)}%</div></div>`).join('') || '<p class="note">응답 없음</p>';
}
function texts(items){ return items.length ? items.map(i => `<div class="free"><div class="who">${esc(i.who)}</div>${esc(i.text)}</div>`).join('') : '<p class="note">응답 없음</p>'; }
function who(r){ const p = r.payload; return `#${r.id} · ${REL[p.rel] || '-'} · ${p.age_band || '-'} · ${REGION[p.region] || '-'}`; }

function render(){
  const P = ROWS.map(r => r.payload || {});
  const n = ROWS.length, nMore = ROWS.filter(r => r.stage === 'more').length;
  const dates = ROWS.map(r => r.created_at).sort();
  document.getElementById('meta').innerHTML = `응답 ${n}건 · ${dates.length ? dates[0].slice(0, 10) + ' ~ ' + dates[dates.length - 1].slice(0, 10) : ''} · 불러온 시각 ${new Date().toLocaleString('ko-KR')}`;
  let h = '';

  h += `<h2>개요</h2><div class="kpis">
    <div class="kpi"><b>${n}</b><span>결과까지 본 응답</span></div>
    <div class="kpi"><b>${nMore}</b><span>한 걸음 더까지 (${pct(nMore, n)}%)</span></div>
    <div class="kpi"><b>${P.filter(p => p.more && (p.more.keep || p.more.shake)).length}</b><span>살게·흔들리게 하는 것을 쓴 응답</span></div>
    <div class="kpi"><b>${P.filter(p => p.gap && Object.keys(p.gap).length).length}</b><span>공백 칸 의견을 쓴 응답</span></div></div>
    <div class="card"><b style="font-size:13px">유입 경로(?src=)</b>${bars(count(ROWS.map(r => r.src || '(없음)')))}</div>`;

  h += `<h2>응답자</h2><div class="grid2">
    <div class="card"><b style="font-size:13px">제주와 나</b>${bars(count(P.map(p => p.rel)), k => REL[k] || k)}</div>
    <div class="card"><b style="font-size:13px">제주에 산 기간 (돌아옴·옴)</b>${bars(count(P.map(p => p.years)), k => YEARS[k] || k)}</div>
    <div class="card"><b style="font-size:13px">나이대</b>${bars(count(P.map(p => p.age_band)))}</div>
    <div class="card"><b style="font-size:13px">사는 곳</b>${bars(count(P.map(p => p.region)), k => REGION[k] || k)}</div>
    <div class="card"><b style="font-size:13px">요즘 나는 (복수)</b>${bars(count(P.flatMap(p => p.stages || [])), k => k, '', n)}</div>
    <div class="card"><b style="font-size:13px">지원사업 경험</b>${bars(count(P.map(p => p.exp)), k => EXP[k] || k)}</div></div>`;

  // 영역별 진단 — 세부 영역마다 고민을 하나라도 고른 사람의 비율
  const grp = {
    '전체': P, '토박이': P.filter(p => p.rel === 'native'), '유입(돌아옴·옴)': P.filter(p => p.rel === 'uturn' || p.rel === 'migrant'),
  };
  const needN = (list, k) => list.filter(p => picked(p).some(id => OPTS[id] && OPTS[id][0] === k)).length;
  const okN = (list, d) => list.filter(p => (p.none || {})[d]).length;
  h += `<h2>영역별 진단 — 고민을 고른 사람</h2><div class="card"><table><thead><tr><th>세부 영역</th>
    ${Object.entries(grp).map(([g, list]) => `<th class="num">${g} (${list.length}명)</th>`).join('')}
    <th class="num">제주 사업 수</th></tr></thead><tbody>` +
    CELLS.map(([k, f, t]) => `<tr><td><span class="pill">${f}</span>${esc(t)}</td>` +
      Object.values(grp).map(list => { const v = needN(list, k); return `<td class="num">${v} <small>(${pct(v, list.length)}%)</small></td>`; }).join('') +
      `<td class="num">${BASE[k] ?? '-'}</td></tr>`).join('') +
    `<tr><td colspan="${Object.keys(grp).length + 2}" style="padding-top:14px;font-weight:700;color:var(--muted)">영역 전체를 '괜찮아요'로 답한 사람</td></tr>` +
    DIMS.map(d => `<tr><td><span class="pill">${d}</span>괜찮아요</td>` +
      Object.values(grp).map(list => { const v = okN(list, d); return `<td class="num">${v} <small>(${pct(v, list.length)}%)</small></td>`; }).join('') + '<td></td></tr>').join('') +
    `</tbody></table><p class="note">%는 각 집단 응답자 수 대비 비율(복수 선택). 제주 사업 수는 주 영역 기준이며 결혼·출산·육아 사업은 뺀 값.</p></div>`;

  h += `<div class="card"><b style="font-size:13px">선택지별 응답 수</b>${bars(count(P.flatMap(picked)), id => OPTS[id] ? `${OPTS[id][1]}` : id, 'c', n)}</div>`;

  // 사업 인지
  const aw = {};
  P.forEach(p => {
    const shown = new Set(Object.values(p.shown || {}).flat());
    shown.forEach(name => { (aw[name] = aw[name] || {shown: 0, new: 0, knew: 0, used: 0}).shown++; });
    Object.entries(p.aware || {}).forEach(([name, v]) => { (aw[name] = aw[name] || {shown: 0, new: 0, knew: 0, used: 0})[v]++; });
  });
  const awList = Object.entries(aw).map(([name, a]) => ({name, ...a, ans: a.new + a.knew + a.used})).sort((x, y) => y.shown - x.shown || y.ans - x.ans);
  const tot = awList.reduce((s, a) => ({ans: s.ans + a.ans, new: s.new + a.new, knew: s.knew + a.knew, used: s.used + a.used}), {ans: 0, new: 0, knew: 0, used: 0});
  h += `<h2>사업 인지 — "이 사업, 알고 있었어요?"</h2>
    <div class="kpis"><div class="kpi"><b>${tot.ans}</b><span>인지 응답 수</span></div>
    <div class="kpi"><b>${pct(tot.new, tot.ans)}%</b><span>처음 봐요</span></div>
    <div class="kpi"><b>${pct(tot.knew, tot.ans)}%</b><span>알고 있었어요</span></div>
    <div class="kpi"><b>${pct(tot.used, tot.ans)}%</b><span>받아봤어요</span></div></div>
    <div class="card"><table><thead><tr><th>사업</th><th class="num">노출</th><th class="num">응답</th><th class="num">처음 봐요</th><th class="num">알고 있었어요</th><th class="num">받아봤어요</th><th class="num">인지율</th></tr></thead><tbody>` +
    awList.slice(0, 60).map(a => `<tr><td>${esc(a.name)}</td><td class="num">${a.shown}</td><td class="num">${a.ans}</td><td class="num">${a.new}</td><td class="num">${a.knew}</td><td class="num">${a.used}</td><td class="num">${a.ans ? pct(a.knew + a.used, a.ans) + '%' : '-'}</td></tr>`).join('') +
    `</tbody></table><p class="note">노출은 결과 화면에 카드가 보인 횟수(더 보기로 연 것 포함). 인지율 = (알고 있었어요 + 받아봤어요) ÷ 응답. 노출 순 상위 60개, 전체는 사업 인지 CSV.</p></div>`;

  // 공백 칸 의견
  const gaps = [];
  ROWS.forEach(r => Object.entries(r.payload.gap || {}).forEach(([k, t]) => gaps.push({k, who: who(r), text: t})));
  h += `<h2>사업이 적은 칸 — "어떤 지원이 있으면 좋겠어요?"</h2>` + CELLS.filter(([k]) => gaps.some(g => g.k === k)).map(([k, , t]) =>
    `<div class="card"><b style="font-size:13px">${esc(t)}</b>${texts(gaps.filter(g => g.k === k))}</div>`).join('') + (gaps.length ? '' : '<p class="note">응답 없음</p>');

  // 한 걸음 더
  const M = P.map(p => p.more).filter(Boolean);
  const rankScore = {};
  M.forEach(m => (m.rank || []).forEach((v, i) => rankScore[v] = (rankScore[v] || 0) + (3 - i)));
  const first = count(M.map(m => (m.rank || [])[0]));
  const sc = k => { const v = M.map(m => (m.sc || {})[k]).filter(x => x != null); return v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(1) + ` (n=${v.length})` : '-'; };
  h += `<h2>한 걸음 더 (${M.length}명)</h2><div class="grid2">
    <div class="card"><b style="font-size:13px">공고에서 가장 먼저 찾는 정보 — 가중 점수(1순위 3·2순위 2·3순위 1)</b>${bars(rankScore, k => k, 'o')}</div>
    <div class="card"><b style="font-size:13px">1순위만</b>${bars(first, k => k, 'o')}</div>
    <div class="card"><b style="font-size:13px">지원사업 소식을 보는 곳 (복수)</b>${bars(count(M.flatMap(m => m.ch || [])), k => k, '', M.length)}</div>
    <div class="card"><b style="font-size:13px">알면서도 신청하지 않은 적</b>${bars(count(M.map(m => m.skip)), k => k === 'yes' ? '있어요' : '없어요', 'c')}
      <div style="margin-top:12px"><b style="font-size:13px">걸린 이유 (복수, 있어요 응답자 기준)</b>${bars(count(M.flatMap(m => m.why || [])), k => k, 'c', M.filter(m => m.skip === 'yes').length)}</div></div></div>
    <div class="card"><table><thead><tr><th>척도 (0~10)</th><th class="num">평균</th></tr></thead><tbody>
      <tr><td>제주 공공기관에 대한 관심</td><td class="num">${sc('a')}</td></tr>
      <tr><td>지원이 필요할 때 공공기관이 먼저 떠오르는 정도</td><td class="num">${sc('b')}</td></tr>
      <tr><td>청년정책이 지금 내 삶에 도움이 되는 정도</td><td class="num">${sc('c')}</td></tr></tbody></table></div>`;

  const TM = key => ROWS.filter(r => r.payload.more && r.payload.more[key]).map(r => ({who: who(r), text: r.payload.more[key]}));
  h += `<h2>서술 응답</h2><div class="grid2">
    <div class="card"><b style="font-size:13px">나를 제주에 계속 살게 만드는 것</b>${texts(TM('keep'))}</div>
    <div class="card"><b style="font-size:13px">여기서 계속 살 수 있을까 싶게 만드는 것</b>${texts(TM('shake'))}</div>
    <div class="card"><b style="font-size:13px">공고에서 찾기 어려웠던 정보</b>${texts(TM('hard'))}</div>
    <div class="card"><b style="font-size:13px">신청하지 않은 이유 — 기타</b>${texts(TM('whyEtc'))}</div>
    <div class="card"><b style="font-size:13px">제주에서 청년으로 산다는 건 ___</b>${texts(TM('line'))}</div></div>`;

  document.getElementById('out').innerHTML = h;
  document.getElementById('csv-main').onclick = () => download('jeju_youth_responses.csv', mainCSV());
  document.getElementById('csv-aware').onclick = () => download('jeju_youth_awareness.csv', awareCSV());
  document.getElementById('csv-text').onclick = () => download('jeju_youth_texts.csv', textCSV());
}

/* ---------- CSV ---------- */
const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
function download(name, rows){
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function mainCSV(){
  const head = ['id','created_at','stage','src','rel','years','age','age_band','region','stages','exp',
    ...Object.keys(OPTS), ...DIMS.map(d => 'ok_' + d), ...CELLS.map(c => 'need_' + c[0]),
    'info_1','info_2','info_3','channels','skip','why','scale_a','scale_b','scale_c','n_shown','n_aware'];
  return [head, ...ROWS.map(r => {
    const p = r.payload, m = p.more || {}, ids = picked(p);
    return [r.id, r.created_at, r.stage, r.src, p.rel, p.years, p.age, p.age_band, p.region, (p.stages || []).join('|'), p.exp,
      ...Object.keys(OPTS).map(id => ids.includes(id) ? 1 : 0), ...DIMS.map(d => (p.none || {})[d] ? 1 : 0),
      ...CELLS.map(c => (p.need || {})[c[0]] || 0),
      ...[0, 1, 2].map(i => (m.rank || [])[i] || ''), (m.ch || []).join('|'), m.skip || '', (m.why || []).join('|'),
      (m.sc || {}).a ?? '', (m.sc || {}).b ?? '', (m.sc || {}).c ?? '',
      new Set(Object.values(p.shown || {}).flat()).size, Object.keys(p.aware || {}).length];
  })];
}
function awareCSV(){
  const out = [['response_id', 'rel', 'need_cell', 'program', 'answer']];
  ROWS.forEach(r => {
    const p = r.payload;
    Object.entries(p.shown || {}).forEach(([k, names]) => names.forEach(name => out.push([r.id, p.rel, k, name, (p.aware || {})[name] || ''])));
  });
  return out;
}
function textCSV(){
  const out = [['response_id', 'rel', 'age_band', 'region', 'item', 'cell', 'text']];
  ROWS.forEach(r => {
    const p = r.payload, m = p.more || {};
    const push = (item, text, cell = '') => { if (text) out.push([r.id, p.rel, p.age_band, p.region, item, cell, text]); };
    push('keep', m.keep); push('shake', m.shake);
    Object.entries(p.gap || {}).forEach(([k, t]) => push('gap', t, k));
    push('hard', m.hard); push('why_etc', m.whyEtc); push('line', m.line);
  });
  return out;
}

/* ---------- 데모 ---------- */
function demoRows(){
  const pick = (a, n = 1) => { const c = a.slice(); const o = []; while (o.length < n && c.length) o.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]); return n === 1 ? o[0] : o; };
  const keys = CELLS.map(c => c[0]);
  return Array.from({length: 40}, (_, i) => {
    const rel = pick(['native', 'native', 'uturn', 'migrant', 'migrant', 'considering']);
    const more = Math.random() < .6;
    const ans = {}, none = {}, need = {};
    DIMS.forEach((d, j) => {
      const own = Object.keys(OPTS).filter(id => OPTS[id][0].startsWith(d));
      if (Math.random() < .25) { ans[d] = []; none[d] = true; }
      else { ans[d] = [].concat(pick(own, 1 + (i + j) % 2)); ans[d].forEach(id => need[OPTS[id][0]] = (need[OPTS[id][0]] || 0) + 1); }
    });
    return {id: i + 1, created_at: new Date(Date.now() - i * 36e5).toISOString(), stage: more ? 'more' : 'result', src: pick(['청년센터', '축제QR', '']),
      payload: {rel, years: rel === 'uturn' || rel === 'migrant' ? pick(Object.keys(YEARS)) : null, age: 20 + i % 19, age_band: pick(['19-24', '25-29', '30-34', '35-39']),
        region: pick(Object.keys(REGION)), stages: pick(['진로·취업 준비', '재직', '창업 준비', '이주·정착'], 2), exp: pick(Object.keys(EXP)),
        ans, none, need,
        shown: {[pick(keys)]: ['청년월세 지원', '정신건강 심리상담 바우처사업', '마이크루']},
        aware: {'청년월세 지원': pick(['new', 'knew', 'used']), '마이크루': pick(['new', 'new', 'knew'])},
        gap: i % 5 ? {} : {'관계_청년커뮤니티': '동네 또래 모임 공간'},
        more: more ? {keep: i % 4 ? '' : '퇴근하고 걷던 바닷길', rank: pick(['내가 받을 수 있는 건지', '뭘, 얼마나 주는지', '언제까지 신청하는지', '어떻게 신청하는지'], 3), ch: pick(['인스타그램', '친구나 지인', '청년센터 문자·알림톡'], 2),
          skip: pick(['yes', 'no']), why: pick(['알았을 때는 이미 마감이었어요', '준비할 서류나 절차가 많았어요', '내가 받을 수 있는지 알 수 없었어요'], 2),
          sc: {a: i % 11, b: (i * 3) % 11, c: (i * 7) % 11}, line: i % 3 ? '' : '바다를 곁에 두고 버티는 일'} : null}};
  });
}

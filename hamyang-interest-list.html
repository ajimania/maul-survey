<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>예약 명단 — 함양 to 남가좌 pop-up</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#F8C33E; --rust:#A8432A; --ink:#1C1A17; --white:#FFFDF8;
  --line:rgba(28,26,23,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Gothic A1',sans-serif;color:var(--ink);background:var(--yellow);
  -webkit-font-smoothing:antialiased;line-height:1.7;
}
#app{max-width:560px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom));}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
h1{font-family:'Black Han Sans',sans-serif;font-size:23px;letter-spacing:-.8px;line-height:1.25;}
.stamp{margin-top:3px;font-size:12.5px;opacity:.7;}
.reload{
  flex:none;background:var(--white);border:2.5px solid var(--ink);border-radius:6px;
  padding:8px 13px;font-family:'Gothic A1',sans-serif;font-weight:700;font-size:13.5px;color:var(--ink);
  cursor:pointer;box-shadow:0 3px 0 rgba(28,26,23,.2);
}
.reload:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(28,26,23,.2);}

.tot{
  margin-top:16px;background:var(--ink);color:var(--white);border-radius:6px;padding:16px 18px;
  display:flex;gap:14px;
}
.tot div{flex:1;text-align:center;}
.tot .k{font-size:12px;opacity:.62;}
.tot .v{font-family:'Black Han Sans',sans-serif;font-size:23px;color:var(--yellow);line-height:1.25;}
.tot .v span{font-family:'Gothic A1',sans-serif;font-size:13px;font-weight:700;color:var(--white);opacity:.75;margin-left:2px;}

.day{margin-top:16px;background:var(--white);border-radius:6px;overflow:hidden;box-shadow:0 3px 0 rgba(28,26,23,.2);}
.dh{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:12px 16px;background:var(--rust);color:var(--white);
}
.dh .d{font-family:'Black Han Sans',sans-serif;font-size:17px;letter-spacing:-.4px;}
.dh .s{font-size:13px;opacity:.88;}
.make{padding:11px 16px;background:rgba(248,195,62,.3);border-bottom:2px dashed var(--line);font-size:14px;font-weight:700;}
.make b{font-family:'Black Han Sans',sans-serif;font-weight:400;color:var(--rust);font-size:16px;}
.r{display:flex;align-items:center;gap:10px;padding:11px 16px;}
.r + .r{border-top:2px dashed var(--line);}
.r .who{flex:1;min-width:0;}
.r .who b{font-size:15.5px;font-weight:700;}
.r .who span{display:block;font-size:12.5px;opacity:.65;margin-top:1px;}
.r .qq{flex:none;font-size:13.5px;text-align:right;line-height:1.45;font-weight:700;}
.r .qq em{font-style:normal;font-family:'Black Han Sans',sans-serif;color:var(--rust);}
.empty{padding:20px;text-align:center;opacity:.6;font-size:14px;}
.vis{margin-top:16px;background:var(--white);border-radius:6px;padding:14px 16px;box-shadow:0 3px 0 rgba(28,26,23,.2);}
.vis .vh{font-family:'Black Han Sans',sans-serif;font-size:15px;letter-spacing:-.4px;}
.vis .vr{display:flex;gap:10px;margin-top:10px;}
.vis .vr div{flex:1;text-align:center;}
.vis .vr .k{font-size:11.5px;opacity:.6;}
.vis .vr .v{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--rust);}
.vis .vr .v span{font-family:'Gothic A1',sans-serif;font-size:12px;font-weight:700;color:var(--ink);opacity:.7;margin-left:2px;}
.vis .by{margin-top:10px;padding-top:9px;border-top:2px dashed var(--line);font-size:12.5px;line-height:1.75;opacity:.75;}
.acts{display:flex;gap:5px;flex:none;}
.acts button{
  border:2px solid var(--ink);background:var(--white);border-radius:5px;
  padding:6px 9px;font-family:'Gothic A1',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink);cursor:pointer;
}
.acts button:active{transform:translateY(1px);}
.r.came{background:rgba(120,160,90,.18);}
.r.came .who b::after{content:' ✓';color:#4E7A34;}
.r.canceled{background:rgba(28,26,23,.07);}
.r.canceled .who b{text-decoration:line-through;opacity:.55;}
.r.canceled .qq{opacity:.45;}

.msg{
  margin-top:16px;padding:14px;border:2.5px solid var(--rust);border-radius:6px;
  background:var(--white);color:var(--rust);font-size:14.5px;font-weight:700;display:none;
}
.msg.on{display:block;}
.note{margin-top:22px;font-size:12.5px;line-height:1.85;text-align:center;opacity:.7;}
.note a{color:var(--rust);font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>예약 명단</h1>
      <div class="stamp" id="stamp">불러오는 중…</div>
    </div>
    <button class="reload" id="reload">새로고침</button>
  </header>

  <div class="msg" id="msg"></div>
  <div id="visits"></div>
  <div id="list"></div>

  <div class="note">
    메일 안내를 받고 예약하신 분들입니다. 한 분당 최대 2개, 날짜별 정원은 없습니다.<br>
    이름을 확인하고 <b>수령</b>을 누르면 체크됩니다. 취소하면 그 수량이 다시 풀립니다.<br>
    마공 가족 사전주문은 <a href="hamyang-preorder-admin.html">여기</a>에서 봅니다.
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(
  'https://hncuvjrghniwihhfpata.supabase.co',
  'sb_publishable_JcCV2PIrJV59VK9ihPCmXg_J0RmJ9AB'
);

const $ = id => document.getElementById(id);
const DOW = ['일','월','화','수','목','금','토'];
const fmt = s => {
  const [y,m,d] = s.split('-').map(Number);
  return `${m}월 ${d}일 ${DOW[new Date(y, m-1, d).getDay()]}`;
};
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

async function load(){
  $('msg').classList.remove('on');
  const [listRes, viewRes] = await Promise.all([
    sb.from('hamyang_interest_list').select('*').order('created_at'),
    sb.from('hamyang_view_stats').select('*')
  ]);
  const { data, error } = listRes;
  renderVisits(viewRes.error ? null : (viewRes.data || []), (listRes.data || []));

  if (error) {
    $('list').innerHTML = '';
    $('stamp').textContent = '';
    $('msg').textContent = '명단을 불러오지 못했어요. SQL 실행이 끝났는지 확인해주세요.';
    $('msg').classList.add('on');
    return;
  }

  const n = new Date();
  $('stamp').textContent =
    `${n.getMonth()+1}월 ${n.getDate()}일 ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')} 기준`;
  render(data || []);
}

function render(rows){
  if (!rows.length) {
    $('list').innerHTML = `<div class="day"><div class="empty">아직 예약이 없어요</div></div>`;
    return;
  }

  const sum = (a, f) => a.reduce((x, r) => x + (r[f] || 0), 0);
  const live = rows.filter(r => r.status !== 'canceled');
  const tot = { e: sum(live,'qty_emotion'), n: sum(live,'qty_energy'), p: sum(live,'party_size') };

  const groups = new Map();
  rows.forEach(r => {
    const k = r.pickup_date || 'unknown';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });
  const keys = [...groups.keys()].sort((a,b) =>
    a === 'unknown' ? 1 : b === 'unknown' ? -1 : a.localeCompare(b));

  $('list').innerHTML =
    `<div class="tot">
       <div><div class="k">예약</div><div class="v">${live.length}<span>건</span></div></div>
       <div><div class="k">예약 수량</div><div class="v">${tot.e + tot.n}<span>개</span></div></div>
       <div><div class="k">예상 인원</div><div class="v">${tot.p || '—'}<span>${tot.p ? '명' : ''}</span></div></div>
     </div>` +
    keys.map(k => {
      const g = groups.get(k);
      const gl = g.filter(r => r.status !== 'canceled');
      const e = sum(gl,'qty_emotion'), n = sum(gl,'qty_energy'), p = sum(gl,'party_size');
      const head = k === 'unknown' ? '날짜 미정' : fmt(k);
      const body = g.map(r => {
        const q = [];
        if (r.qty_energy)  q.push(`체력 <em>${r.qty_energy}</em>`);
        if (r.qty_emotion) q.push(`정서 <em>${r.qty_emotion}</em>`);
        const bits = [];
        if (r.phone_tail) bits.push(r.phone_tail);
        if (r.party_size) bits.push(r.party_size >= 4 ? '4명 이상' : `${r.party_size}명`);
        const t = new Date(r.created_at);
        bits.push(`${t.getMonth()+1}/${t.getDate()} 접수`);
        if (r.status === 'canceled') bits.push('취소됨');
        const acts = r.status === 'canceled'
          ? `<button data-id="${r.id}" data-s="open">되돌리기</button>`
          : r.status === 'came'
            ? `<button data-id="${r.id}" data-s="open">수령취소</button>`
            : `<button data-id="${r.id}" data-s="came">수령</button>
               <button data-id="${r.id}" data-s="canceled">취소</button>`;
        return `<div class="r ${r.status || 'open'}">
            <div class="who"><b>${esc(r.name || '이름없음')}</b><span>${esc(bits.join(' · '))}</span></div>
            <div class="qq">${q.join('<br>') || '—'}</div>
            <div class="acts">${acts}</div>
          </div>`;
      }).join('');
      return `<div class="day">
          <div class="dh"><span class="d">${head}</span>
            <span class="s">${gl.length}건${p ? ' · ' + p + '명' : ''}</span></div>
          <div class="make">예약 — 체력함양 <b>${n}</b> · 정서함양 <b>${e}</b></div>
          ${body}
        </div>`;
    }).join('');

  $('list').querySelectorAll('.acts button').forEach(b => { b.onclick = () => setStatus(b); });
}

async function setStatus(btn){
  const id = Number(btn.dataset.id), st = btn.dataset.s;
  if (st === 'canceled' && !confirm('이 예약을 취소할까요? 수량이 다시 풀립니다.')) return;
  btn.disabled = true;
  const { data, error } = await sb.rpc('hamyang_interest_set_status', { p_id: id, p_status: st });
  if (error || !data || !data.ok) {
    $('msg').textContent = '바꾸지 못했어요. 다시 눌러주세요.';
    $('msg').classList.add('on');
    btn.disabled = false;
    return;
  }
  load();
}

function renderVisits(stats, rows){
  if (!stats) { $('visits').innerHTML = ''; return; }   // SQL 아직 미실행이면 숨김
  const mine = stats.filter(r => r.page === 'interest');
  const views    = mine.reduce((a,r) => a + Number(r.views || 0), 0);
  const visitors = mine.reduce((a,r) => a + Number(r.visitors || 0), 0);
  const live = rows.filter(r => r.status !== 'canceled').length;
  const rate = visitors ? Math.round(live / visitors * 100) : 0;
  const by = mine
    .sort((a,b) => Number(b.visitors) - Number(a.visitors))
    .map(r => `${esc(r.src)} ${r.visitors}명`)
    .join(' · ');
  $('visits').innerHTML = `<div class="vis">
      <div class="vh">링크 열어본 사람</div>
      <div class="vr">
        <div><div class="k">방문자</div><div class="v">${visitors}<span>명</span></div></div>
        <div><div class="k">열어본 횟수</div><div class="v">${views}<span>회</span></div></div>
        <div><div class="k">예약 전환</div><div class="v">${rate}<span>%</span></div></div>
      </div>
      ${by ? `<div class="by">유입: ${by}</div>` : ''}
    </div>`;
}

$('reload').onclick = load;
load();
</script>
</body>
</html>

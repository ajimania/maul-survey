<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>사전주문 명단 — 함양 샌드위치</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3EC; --card:#FFFEFA; --crayon:#211F1C; --white:#FDFCF8;
  --amber:#E8A13D; --amber-deep:#D4882A; --green:#5F7F4E; --onion:#EBCF8A;
  --text:#33312C; --muted:#8A857B; --line:rgba(33,31,28,.14); --red:#C8563C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Gowun Dodum',sans-serif;color:var(--text);background:var(--paper);
  -webkit-font-smoothing:antialiased;line-height:1.7;
}
#app{max-width:560px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom));}

header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
h1{font-family:'Jua',sans-serif;font-size:22px;letter-spacing:-.5px;}
.reload{
  background:var(--card);border:2.5px solid var(--crayon);border-radius:11px;
  padding:7px 13px;font-family:'Gowun Dodum',sans-serif;font-size:13.5px;color:var(--text);
  cursor:pointer;box-shadow:2px 2px 0 rgba(33,31,28,.15);
}
.reload:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(33,31,28,.15);}
.stamp{margin-top:4px;font-size:12.5px;color:var(--muted);}

/* 총계 */
.total{
  margin-top:16px;background:var(--crayon);color:var(--white);border-radius:14px;
  padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.total .l{font-size:13.5px;opacity:.72;}
.total .r{font-family:'Jua',sans-serif;font-size:20px;}

/* 날짜 블록 */
.day{
  margin-top:16px;background:var(--card);border:2.5px solid var(--crayon);border-radius:16px;
  box-shadow:3px 3px 0 rgba(33,31,28,.14);overflow:hidden;
}
.day.past{opacity:.5;}
.dh{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:13px 16px;background:var(--onion);border-bottom:2.5px solid var(--crayon);
}
.dh .d{font-family:'Jua',sans-serif;font-size:18px;letter-spacing:-.4px;}
.dh .d em{font-style:normal;font-size:13.5px;color:#6b5a2e;margin-left:5px;}
.dh .s{font-size:13.5px;color:#6b5a2e;text-align:right;line-height:1.5;}
.make{
  padding:11px 16px;background:rgba(232,161,61,.14);border-bottom:2px dashed var(--line);
  font-size:14.5px;
}
.make b{font-family:'Jua',sans-serif;font-weight:400;color:var(--amber-deep);}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px;}

/* 주문 줄 */
.o{display:flex;align-items:center;gap:10px;padding:12px 16px;}
.o + .o{border-top:2px dashed var(--line);}
.o .who{flex:1;min-width:0;}
.o .who b{font-size:16px;font-weight:400;}
.o .who span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;}
.o .qq{flex:none;font-size:14px;text-align:right;line-height:1.45;}
.o .qq em{font-style:normal;font-family:'Jua',sans-serif;color:var(--amber-deep);}
.acts{display:flex;gap:5px;flex:none;}
.acts button{
  border:2px solid var(--crayon);background:var(--card);border-radius:9px;
  padding:6px 9px;font-family:'Gowun Dodum',sans-serif;font-size:12.5px;color:var(--text);cursor:pointer;
}
.acts button:active{transform:translate(1px,1px);}
.o.picked{background:#EDF3E8;}
.o.picked .who b::after{content:' ✓';color:var(--green);}
.o.canceled{background:#F4F2EE;}
.o.canceled .who b{text-decoration:line-through;color:var(--muted);}
.o.canceled .qq{color:var(--muted);}
.tag{font-size:11.5px;color:var(--muted);}

.note{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.8;text-align:center;}
.sect{
  margin-top:30px;font-family:'Jua',sans-serif;font-size:17px;letter-spacing:-.4px;
  padding-bottom:7px;border-bottom:2.5px solid var(--crayon);
}
.sect span{font-family:'Gowun Dodum',sans-serif;font-size:12px;color:var(--muted);margin-left:7px;}
.ic{display:flex;align-items:center;gap:10px;padding:12px 16px;}
.ic + .ic{border-top:2px dashed var(--line);}
.ic .who{flex:1;min-width:0;}
.ic .who b{font-size:15.5px;font-weight:400;}
.ic .who span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;}
.ic .qq{flex:none;font-size:13.5px;text-align:right;line-height:1.45;}
.ic .qq em{font-style:normal;font-family:'Jua',sans-serif;color:var(--amber-deep);}
.msg{
  margin-top:16px;padding:14px;border:2.5px solid var(--red);border-radius:13px;
  background:#FBEDE9;color:#9B3D28;font-size:14.5px;display:none;
}
.msg.on{display:block;}
.loading{margin-top:24px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>사전주문 명단</h1>
      <div class="stamp" id="stamp">불러오는 중…</div>
    </div>
    <button class="reload" id="reload">새로고침</button>
  </header>

  <div class="msg" id="msg"></div>

  <div class="sect">마공 사전주문 <span>정원 있음 · 예약</span></div>
  <div id="list"><div class="loading">불러오는 중…</div></div>

  <div class="note">
    이름을 확인하고 <b>수령</b>을 누르면 체크됩니다.<br>
    취소한 주문의 수량은 사전주문 페이지에서 다시 풀립니다.
  </div>

  <div id="interestWrap" hidden>
    <div class="sect">사전 수요조사 <span>정원 없음 · 예약 아님</span></div>
    <div id="ilist"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(
  'https://hncuvjrghniwihhfpata.supabase.co',
  'sb_publishable_JcCV2PIrJV59VK9ihPCmXg_J0RmJ9AB'
);

const $ = id => document.getElementById(id);
const DOW = ['일','월','화','수','목','금','토'];
const won = n => n.toLocaleString('ko-KR');
const fmt = s => {
  const [y,m,d] = s.split('-').map(Number);
  return { label:`${m}월 ${d}일`, dow:DOW[new Date(y, m-1, d).getDay()] };
};
const today = () => {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
};

function showMsg(t){ $('msg').textContent = t; $('msg').classList.add('on'); }
function hideMsg(){ $('msg').classList.remove('on'); }

async function load(){
  hideMsg();
  const [slots, orders] = await Promise.all([
    sb.from('hamyang_preorder_slots').select('pickup_date,is_open,cap_emotion,cap_energy,sort').order('sort'),
    sb.from('hamyang_preorder_list').select('*').order('created_at')
  ]);

  if (slots.error || orders.error) {
    $('list').innerHTML = '';
    showMsg('명단을 불러오지 못했어요. 잠시 뒤 새로고침 해주세요.');
    $('stamp').textContent = '';
    return;
  }
  render(slots.data || [], orders.data || []);
  loadInterest();
  const n = new Date();
  $('stamp').textContent =
    `${n.getMonth()+1}월 ${n.getDate()}일 ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')} 기준`;
}

function render(slots, orders){
  const live = orders.filter(o => o.status !== 'canceled');
  const tot = {
    e: live.reduce((a,o) => a + (o.qty_emotion||0), 0),
    n: live.reduce((a,o) => a + (o.qty_energy||0), 0),
    w: live.reduce((a,o) => a + (o.total_price||0), 0)
  };
  const td = today();

  let html = `<div class="total">
      <span class="l">전체 사전주문</span>
      <span class="r">${tot.e + tot.n}개 · ${won(tot.w)}원</span>
    </div>`;

  html += slots.map(s => {
    const rows = orders.filter(o => o.pickup_date === s.pickup_date);
    const day  = rows.filter(o => o.status !== 'canceled');
    const e = day.reduce((a,o) => a + (o.qty_emotion||0), 0);
    const n = day.reduce((a,o) => a + (o.qty_energy||0), 0);
    const w = day.reduce((a,o) => a + (o.total_price||0), 0);
    const f = fmt(s.pickup_date);

    const body = rows.length
      ? rows.map(o => {
          const q = [];
          if (o.qty_emotion) q.push(`정서 <em>${o.qty_emotion}</em>`);
          if (o.qty_energy)  q.push(`체력 <em>${o.qty_energy}</em>`);
          const t = new Date(o.created_at);
          const when = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 접수`;
          const acts = o.status === 'canceled'
            ? `<button data-id="${o.id}" data-s="pending">되돌리기</button>`
            : o.status === 'picked'
              ? `<button data-id="${o.id}" data-s="pending">수령취소</button>`
              : `<button data-id="${o.id}" data-s="picked">수령</button>
                 <button data-id="${o.id}" data-s="canceled">취소</button>`;
          return `<div class="o ${o.status || 'pending'}">
              <div class="who"><b>${esc(o.name || '이름없음')}</b>
                <span>${when}${o.status === 'canceled' ? ' · <span class="tag">취소됨</span>' : ''}</span></div>
              <div class="qq">${q.join('<br>') || '—'}</div>
              <div class="acts">${acts}</div>
            </div>`;
        }).join('')
      : `<div class="empty">아직 주문이 없어요</div>`;

    return `<div class="day${s.pickup_date < td ? ' past' : ''}">
        <div class="dh">
          <span class="d">${f.label}<em>${f.dow}</em></span>
          <span class="s">${day.length}건 · ${won(w)}원${s.is_open ? '' : '<br>닫힘'}</span>
        </div>
        <div class="make">만들 개수 — 정서함양 <b>${e}</b> · 체력함양 <b>${n}</b>
          <span style="color:var(--muted);font-size:12.5px">(정원 ${s.cap_emotion}·${s.cap_energy})</span></div>
        ${body}
      </div>`;
  }).join('');

  $('list').innerHTML = html;
  $('list').querySelectorAll('.acts button').forEach(b => { b.onclick = () => setStatus(b); });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

async function setStatus(btn){
  const id = Number(btn.dataset.id), st = btn.dataset.s;
  if (st === 'canceled' && !confirm('이 주문을 취소할까요? 수량이 다시 풀립니다.')) return;
  btn.disabled = true;
  const { data, error } = await sb.rpc('hamyang_preorder_set_status', { p_id: id, p_status: st });
  if (error || !data || !data.ok) {
    showMsg('바꾸지 못했어요. 다시 눌러주세요.');
    btn.disabled = false;
    return;
  }
  load();
}

/* ───────── 사전 수요조사 (정원 없음, 예약 아님) ───────── */
async function loadInterest(){
  const { data, error } = await sb.from('hamyang_interest_list').select('*').order('created_at');
  if (error) { $('interestWrap').hidden = true; return; }   // SQL 아직 미실행이면 조용히 숨김
  $('interestWrap').hidden = false;

  const rows = data || [];
  if (!rows.length) {
    $('ilist').innerHTML = `<div class="day"><div class="empty">아직 신청이 없어요</div></div>`;
    return;
  }

  const groups = new Map();
  rows.forEach(r => {
    const k = r.pickup_date || 'unknown';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });
  const keys = [...groups.keys()].sort((a,b) =>
    a === 'unknown' ? 1 : b === 'unknown' ? -1 : a.localeCompare(b));

  const tot = {
    e: rows.reduce((a,r) => a + (r.qty_emotion||0), 0),
    n: rows.reduce((a,r) => a + (r.qty_energy||0), 0),
    p: rows.reduce((a,r) => a + (r.party_size||0), 0)
  };

  $('ilist').innerHTML =
    `<div class="total"><span class="l">전체 수요</span>
       <span class="r">${rows.length}건 · ${tot.e + tot.n}개</span></div>` +
    keys.map(k => {
      const g = groups.get(k);
      const e = g.reduce((a,r) => a + (r.qty_emotion||0), 0);
      const n = g.reduce((a,r) => a + (r.qty_energy||0), 0);
      const p = g.reduce((a,r) => a + (r.party_size||0), 0);
      const head = k === 'unknown' ? '날짜 미정' : `${fmt(k).label} ${fmt(k).dow}`;
      const body = g.map(r => {
        const q = [];
        if (r.qty_emotion) q.push(`정서 <em>${r.qty_emotion}</em>`);
        if (r.qty_energy)  q.push(`체력 <em>${r.qty_energy}</em>`);
        const bits = [];
        if (r.party_size) bits.push(r.party_size >= 4 ? '4명 이상' : `${r.party_size}명`);
        if (r.phone_tail) bits.push(r.phone_tail);
        return `<div class="ic">
            <div class="who"><b>${esc(r.name || '이름없음')}</b>
              <span>${esc(bits.join(' · '))}</span></div>
            <div class="qq">${q.join('<br>') || '—'}</div>
          </div>`;
      }).join('');
      return `<div class="day">
          <div class="dh"><span class="d">${head}</span>
            <span class="s">${g.length}건${p ? ' · ' + p + '명' : ''}</span></div>
          <div class="make">희망 수량 — 정서함양 <b>${e}</b> · 체력함양 <b>${n}</b></div>
          ${body}
        </div>`;
    }).join('');
}

$('reload').onclick = load;
load();
</script>
</body>
</html>
